name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: xvfb-run -a npm run test:e2e

  package:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, args: "" }
          # Intel Macs on macOS 10.13 to 12: Electron 26 is the last to run there.
          - name: macOS-older
            os: macos-latest
            args: "--mac dmg --x64 -c.electronVersion=26.6.10 -c.mac.minimumSystemVersion=10.13 '-c.mac.artifactName=Quire-${version}-older-Macs-Intel.${ext}'"
          - { name: Windows, os: windows-latest, args: "" }
          - { name: Linux, os: ubuntu-latest, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never ${{ matrix.args }}
        shell: bash
        env:
          # No signing certificate yet: build unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: quire-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # Each push to main puts the installers on the Releases page, under the
  # version in package.json. Bump the version to start a new release.
  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Quire ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            installers/*.dmg
            installers/*.exe
            installers/*.AppImage
            installers/*.deb
          body: |
            **Mac with Apple Silicon (M1 or later), macOS 13 or newer:** download `Quire-…-arm64.dmg`.
            **Older or Intel Mac (macOS 10.13 to 12):** download `Quire-…-older-Macs-Intel.dmg`.
            Open the `.dmg` and drag Quire to Applications. The first time, right-click Quire and choose Open.
            **Windows:** download the `.exe` and run it. If Windows warns you, choose More info → Run anyway.
            **Linux:** download the `.AppImage` (make it executable) or the `.deb`.
