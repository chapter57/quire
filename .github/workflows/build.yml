name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: xvfb-run -a npm run test:e2e

  package:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
        env:
          # No signing certificate yet: build unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: quire-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # A version tag (v0.1.0, v0.2.0...) puts the installers on the Releases page.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/*.dmg
            installers/*.exe
            installers/*.AppImage
            installers/*.deb
          make_latest: true
          body: |
            **Mac (Apple Silicon):** download the `.dmg`, open it and drag Quire to Applications. The first time, right-click Quire and choose Open.
            **Windows:** download the `.exe` and run it. If Windows warns you, choose More info → Run anyway.
            **Linux:** download the `.AppImage` (make it executable) or the `.deb`.
